spring:
  docker:
    compose:
      enabled: false     # Docker Compose not used in production

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    show-sql: false

# ── Structured JSON logging (ECS format) ─────────────────────────
logging:
  structured:
    format:
      console: ecs
  level:
    com.studentresults: INFO
    org.springframework: WARN
